---
# control
control:
  data_name: TwoMoons
  model_name: mlp
  formulation_mode: ot # TODO: need to rename got,ot, angle
  is_time: 1
  is_cond: 0
  regularization:
    v: 1.0
    x0: 1.0
    x1: 1.0
# generate
generate:
  num_steps: 100
  guidance_scale: 2.
  eta: 1.
# experiment
pin_memory: True
num_workers: 0
init_seed: 0
num_experiments: 1
log_interval: 0.25
device: cuda
resume_mode: 0
profile: False
